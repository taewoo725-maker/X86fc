; X86FC.INI - 파일 연결 (확장자 = 명령). X86FC.COM 과 같은 폴더에 두세요.
; %s = 고른 파일 경로, %f = 확장자 뺀 경로. ; 로 시작하는 줄은 설명입니다.
; COM·BAT 는 줄이 없어도 바로 실행됩니다. 한 확장자에 줄이 여러 개면 Enter 에서 풀다운으로 고릅니다.
; 명령 여러 개는 ; 로 이어 씁니다. 이 파일은 앞 2000 바이트만 읽으니 줄은 위쪽에 쓰세요.

ASC = BASIC %s
BAS = BASIC %s
BAT = %s;AKID %s
BGM = MUPLAY %s
COM = %s
DOC = AKID %s
GIF = x86view %s
INI = AKID %s
JPG = x86view %s
MCF = AKID %s
MD = AKID %s
ME = AKID %s
MGS = MUPLAY %s
MID = X86MIDI %s;MIDRY /I51 %s
MSD = MUPLAY %s
PCM = MPCM %s /T /W1A
S16 = BLS %s
SC2 = SC2VIEW %s
SC5 = BLS %s
SC6 = BLS %s
SC7 = BLS %s
SC8 = BLS %s
SCA = BLS %s
SCC = BLS %s
SDT = SC %s
SR8 = BLS %s
TXT = AKID %s
VGM = VGMPLAY /l1 %s;POPVGM %s
MP3 = X86MP3 %s


; ======================================================================
; 아래는 설명입니다 (읽지 않음).  이 파일 하나에 설정·연결·메뉴·Quick-Dir·명령줄 기록이 모두 들어갑니다 (파일 크기 한도 없음).
; ----------------------------------------------------------------------
; 연결: 위의 "확장자 = 명령" 줄.  %s = 고른 파일 경로, %f = 확장자 뺀 경로, ; 로 명령을 이어 씀. 한 확장자에 여러 줄이면 Enter 에서 풀다운으로 고름.
;   (Ctrl+F3 의 열기 목록에서 INS·DEL·D 로 고치면 그 확장자 줄들이 아래쪽에 새로 적힙니다.)
;   HLP = #VIEW   내부 보기, #EDIT 내부 편집기 (예: HLP = #VIEW 는 Enter 로 내부 텍스트 보기, ; 로 다른 명령과 이으면 풀다운)
; 화면 방식: F4 = 글자(0) -> SCREEN 7 -> SCREEN 7 한글(7H) -> 글자.  고른 방식이 아래쪽의 SCREEN = 0 / 7 / 7H 줄에 자동 저장됩니다
;   (처음 값을 직접 적어도 됨).  7H 는 X86FC.OVL 에 글꼴이 들어 있어야 하고(0.12.14 부터 글꼴이 OVL 뒤에 붙음), 없으면 SCREEN 7 로 뜹니다.
;   시작 옵션: X86FC /7  /7H  /0
; 줄 수: SCREEN 7 은 26줄(목록 20줄)로 뜹니다.  7H 는 기본 21줄(줄 높이 10점)이고, LINES = tight 를 적으면 줄 높이 9점 23줄(목록 17줄, 한글 위아래 간격 없음)로 뜹니다.
; 정렬: F8 로 고른 정렬이 SORT = name / ext / size / date 줄로 저장됩니다 (첫 글자만 봄).
; 확장자별 색 (SCREEN 7 에서만, 색 번호 0~15, 서로 다른 색 7가지까지):   COLOR TXT = 10      COLOR LZH = 13
;   4 흰색  5 회색  7 노랑  8 주황(폴더)  9 연두  10 하늘  11 분홍  12 주황  13 살구  14 보라  15 청록
; 배경색 (SCREEN 7, R G B 각 0~7):   BGP = 215
; 사용자 메뉴(Ctrl+G): MENU 제목 = 명령 줄.  "CD 경로" 는 그 폴더로 이동, 그 밖에는 명령줄처럼 실행.  %s = 커서 파일 이름, %f = 확장자 뺀 이름.
;   메뉴 창에서 INS 추가, F2 고치기, DEL 지우기 하면 MENU 줄들이 자동으로 바뀝니다.
; Quick-Dir(Ctrl+B): QDIR = 경로 줄.  명령줄 기록(/ 다음 ↑↓): HIST = 명령 줄 (최근 것이 맨 위, 4개) - 둘 다 프로그램이 알아서 적습니다.
; 옛 X86FC.SET · X86FC.MNU · X86FC.QD · X86FC.HIS 파일이 있으면 처음 실행 때 이 파일로 옮기고 지웁니다.
; 한글 입력(7H 이름 바꾸기·폴더 만들기): MSX 의 한/영(KANA/CODE) 키로 한글 <-> 영문.  긴 이름: 파일 목록은 8.3 이름이고 아래 정보 줄에 긴 이름이 나옵니다.
